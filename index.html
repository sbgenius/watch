<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Player</title>
<style>
:root{
  --bg:#0a0a0d; --bg3:#1c1c24; --border:#2a2a35;
  --accent:#ff3d54; --accent2:#ff6a7a; --danger:#ff5c6c;
  --text:#f2f2f5; --text2:#a7a7b5; --text3:#72727f;
  --font:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.hidden{display:none!important}

.btn{padding:.55rem 1.1rem;border:0;background:rgba(255,255,255,.09);color:var(--text);border-radius:4px;font-weight:600;font-size:.82rem;transition:background .15s}
.btn:hover{background:rgba(255,255,255,.18)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2)}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);z-index:9999;background:#f2f2f5;color:#0a0a0d;font-size:.82rem;font-weight:600;padding:.7rem 1.3rem;border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.55);pointer-events:none;max-width:90vw;text-align:center}

/* landing */
.landing{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.card{width:100%;max-width:520px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:1.6rem;display:flex;flex-direction:column;gap:1rem}
.card h1{font-size:1.1rem;font-weight:700}
.card p{font-size:.85rem;color:var(--text2);line-height:1.5}
.card .row{display:flex;gap:.5rem}
.card input{flex:1;min-width:0;background:rgba(255,255,255,.07);border:1px solid transparent;border-radius:4px;padding:.65rem .9rem;font-size:.88rem;outline:none}
.card input:focus{border-color:var(--accent)}
.card .err{color:var(--danger);font-size:.82rem;min-height:1.2em}

/* player */
.overlay{position:fixed;inset:0;background:#000;z-index:500;display:flex}
.player{background:#000;width:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.player-bar{display:flex;align-items:center;gap:1rem;padding:.9rem 1.4rem;background:linear-gradient(to bottom,rgba(0,0,0,.9),rgba(0,0,0,0));position:relative;z-index:2;margin-bottom:-.5rem}
.player-title{min-width:0;flex:1}
.player-name{font-size:1.05rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-sub{font-size:.76rem;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.1rem}
.player-actions{display:flex;gap:.5rem;flex:none}
.player-actions .btn{padding:.4rem .95rem;font-size:.8rem;background:rgba(255,255,255,.12)}
.player-actions .btn:hover{background:rgba(255,255,255,.24)}
.stage{background:#000;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
video{display:block;width:100%;height:100%;background:#000;object-fit:contain}
.player-foot{padding:.8rem 1.4rem 1.1rem;background:linear-gradient(to top,#0c0c10,#050507);border-top:1px solid rgba(255,255,255,.06)}
.ctrls{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;max-width:1100px;margin:0 auto}
.ctrls .grow{flex:1}
.ctrls .btn{padding:.42rem .85rem;font-size:.78rem;font-variant-numeric:tabular-nums}
.ctrls label{display:flex;align-items:center;gap:.5rem;font-size:.78rem;color:var(--text2);font-weight:500}
.ctrls select,.ctrls input{background:rgba(255,255,255,.08);border:1px solid transparent;border-radius:4px;padding:.4rem .8rem;font-size:.78rem;outline:none}
.ctrls select option{background:#17171e}
.ctrls select:focus,.ctrls input:focus{border-color:var(--accent)}
.jump{width:96px;text-align:center}
.strip{display:flex;gap:2px;height:4px;margin:.9rem auto .6rem;max-width:1100px;border-radius:2px;overflow:hidden}
.strip i{flex:1;background:rgba(255,255,255,.12)}
.strip i.on{background:rgba(255,255,255,.5)}
.strip i.now{background:var(--accent)}
.status{color:var(--text3);font-size:.74rem;min-height:1.3em;max-width:1100px;margin:0 auto}
@media (max-width:768px){
  .player-bar{padding:.7rem 1rem}
  .player-foot{overflow:auto;max-height:42dvh;padding:.7rem 1rem 1rem}
  .ctrls .grow{flex-basis:100%;height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}
</style>
</head>
<body>

<div class="landing" id="landing">
  <div class="card">
    <h1>Open a video</h1>
    <p>Paste a video link below. Videos are unlisted and can only be opened with their own link.</p>
    <div class="row">
      <input id="pasteBox" placeholder="Paste video link" autocomplete="off" spellcheck="false" aria-label="Video link">
      <button class="btn primary" id="pasteGo">Open</button>
    </div>
    <div class="err" id="landErr" role="alert"></div>
  </div>
</div>

<div class="overlay hidden" id="playerOverlay">
  <div class="player" role="dialog" aria-modal="true" aria-labelledby="pTitle">
    <div class="player-bar">
      <div class="player-title">
        <div class="player-name" id="pTitle"></div>
        <div class="player-sub" id="pSub"></div>
      </div>
      <div class="player-actions">
        <button class="btn" id="copyLink">Copy link</button>
        <button class="btn" id="closePlayer">Close</button>
      </div>
    </div>
    <div class="stage"><video id="video" controls playsinline></video></div>
    <div class="player-foot">
      <div class="ctrls">
        <button class="btn" data-skip="-300">-5 min</button>
        <button class="btn" data-skip="-30">-30 s</button>
        <button class="btn" data-skip="30">+30 s</button>
        <button class="btn" data-skip="300">+5 min</button>
        <span class="grow"></span>
        <label>Speed
          <select id="speed">
            <option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option>
          </select>
        </label>
        <input class="jump" id="jump" placeholder="h:mm:ss" aria-label="Jump to time">
        <button class="btn primary" id="jumpBtn">Jump</button>
      </div>
      <div class="strip" id="strip" aria-hidden="true"></div>
      <div class="status" id="status" role="status"></div>
    </div>
  </div>
</div>

<script>
'use strict';
/* ====== config (keep in sync with main.py / worker) ====== */
const WORKER = 'https://streamer.shreyasgokhale200.workers.dev';
const AHEAD = 4, BEHIND = 2;
const SECRET_RE = /^[A-Za-z0-9_-]{43}$/;

const $ = (s) => document.querySelector(s);
const enc = new TextEncoder(), dec = new TextDecoder();

/* ====== crypto ======
   tag = "v" + sha256("tag:" + secret)   -> public release tag (what the worker sees)
   key = sha256("key:" + secret)         -> AES-256-GCM key (never leaves the browser)
   The secret lives in the URL #fragment, which browsers never send to servers. */
const hex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
async function deriveFromSecret(secret) {
  const tag = 'v' + hex(await crypto.subtle.digest('SHA-256', enc.encode('tag:' + secret)));
  const raw = await crypto.subtle.digest('SHA-256', enc.encode('key:' + secret));
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  return { tag, key };
}
// iv(12) || ct || tag(16), AAD = asset name   (manifest.bin, init.bin, seg_*.bin)
function decryptChunk(key, name, buf) {
  const u = new Uint8Array(buf);
  return crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: u.slice(0, 12), additionalData: enc.encode(name) }, key, u.slice(12));
}

/* ====== helpers ====== */
function fmtLong(s) {
  s = Math.round(s || 0);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h} h ${m} min` : `${m} min`;
}
const fmtSize = (b) => b >= 1e9 ? (b / 1e9).toFixed(2) + ' GB' : b >= 1e6 ? (b / 1e6).toFixed(0) + ' MB' : (b / 1e3).toFixed(0) + ' KB';
let toastTimer;
function toast(msg) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.append(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2200);
}
const setStatus = (t, bad) => { const s = $('#status'); s.textContent = t; s.style.color = bad ? 'var(--danger)' : ''; };

/* ====== routing: location.hash IS the secret ====== */
const hashSecret = () => location.hash.replace(/^#\/?/, '');

function route() {
  const secret = hashSecret();
  if (!secret) { hidePlayer(); showLanding(''); return; }
  if (!SECRET_RE.test(secret)) { hidePlayer(); showLanding('That link is not valid.'); return; }
  $('#landing').classList.add('hidden');
  showPlayer(secret);
}
function showLanding(msg) {
  $('#landing').classList.remove('hidden');
  $('#landErr').textContent = msg;
  document.title = 'Player';
}
$('#pasteGo').onclick = () => {
  const v = $('#pasteBox').value.trim().split('#').pop().replace(/^\//, '');
  if (!SECRET_RE.test(v)) { $('#landErr').textContent = 'That does not look like a valid video link.'; return; }
  $('#pasteBox').value = '';
  location.hash = v;
};
$('#pasteBox').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#pasteGo').click(); });
window.addEventListener('hashchange', route);

/* ====== player ====== */
const video = $('#video');
let S = null;

function showPlayer(secret) {
  $('#playerOverlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  openVideo(secret);
}
function hidePlayer() {
  if ($('#playerOverlay').classList.contains('hidden')) return;
  $('#playerOverlay').classList.add('hidden');
  document.body.style.overflow = '';
  stopPlayback();
}
function closePlayer() { history.replaceState(null, '', location.pathname + location.search); route(); }
$('#closePlayer').onclick = (e) => { e.currentTarget.blur(); closePlayer(); };
$('#copyLink').onclick = async (e) => {
  e.currentTarget.blur();
  try { await navigator.clipboard.writeText(location.href); toast('Link copied'); }
  catch { toast('Could not copy. Copy the address bar instead.'); }
};

function stopPlayback() {
  if (!S) return;
  S.dead = true;
  clearInterval(S.saver);
  if (S.inflight) S.inflight.ctrl.abort();
  try { video.pause(); } catch {}
  video.removeAttribute('src'); video.load();
  if (S.url) URL.revokeObjectURL(S.url);
  S = null;
}

// part 0 keeps the plain tag; overflow parts are tag-1, tag-2, ...
const relTag = (tag, p) => (p ? `${tag}-${p}` : tag);

async function fetchBuf(url, signal) {
  const r = await fetch(url, { signal });
  if (r.status === 404) throw new Error('Video not found. The link may be wrong or the video was deleted.');
  if (!r.ok) throw new Error(`Download failed (${r.status})`);
  return r.arrayBuffer();
}

async function openVideo(secret) {
  if (S && S.secret === secret) return;
  stopPlayback();
  $('#pTitle').textContent = 'Opening...';
  $('#pSub').textContent = '';
  $('#strip').innerHTML = '';
  setStatus('Opening...');
  const sess = { secret, dead: false, have: new Set(), inflight: null, pumping: false, again: false };
  S = sess;
  try {
    const { tag, key } = await deriveFromSecret(secret);
    sess.tag = tag; sess.key = key;
    const buf = await fetchBuf(`${WORKER}/r/${tag}/manifest.bin`);
    let man;
    try { man = JSON.parse(dec.decode(await decryptChunk(key, 'manifest.bin', buf))); }
    catch { throw new Error('Could not decrypt this video. The link is incorrect.'); }
    if (sess.dead) return;
    $('#pTitle').textContent = man.title || 'Video';
    $('#pSub').textContent = [fmtLong(man.duration), man.size ? fmtSize(man.size) : ''].filter(Boolean).join(', ');
    document.title = man.title || 'Video';
    if (!window.MediaSource || !MediaSource.isTypeSupported(man.mime))
      throw new Error('This browser cannot play this video format (needs Media Source Extensions).');
    Object.assign(sess, { man, segs: man.segments, ms: new MediaSource() });
    sess.url = URL.createObjectURL(sess.ms);
    video.src = sess.url;
    await new Promise((res) => sess.ms.addEventListener('sourceopen', res, { once: true }));
    if (sess.dead) return;
    sess.ms.duration = man.duration;
    sess.sb = sess.ms.addSourceBuffer(man.mime);
    sess.sb.mode = 'segments';
    sess.chain = Promise.resolve();

    const strip = $('#strip');
    sess.cells = sess.segs.map(() => strip.appendChild(document.createElement('i')));

    const initBuf = await decryptChunk(key, man.init, await fetchBuf(`${WORKER}/r/${relTag(tag, man.init_part || 0)}/${man.init}`));
    if (sess.dead) return;
    await sbOp(sess, () => sbWait(sess.sb, () => sess.sb.appendBuffer(initBuf)));

    let saved = 0; try { saved = parseFloat(localStorage.getItem('pos:' + tag) || '0'); } catch {}
    if (saved > 5 && saved < man.duration - 5) video.currentTime = saved;
    video.playbackRate = parseFloat($('#speed').value);
    sess.saver = setInterval(() => {
      try { if (!video.paused) localStorage.setItem('pos:' + tag, String(video.currentTime)); } catch {}
    }, 5000);
    pump();
  } catch (e) {
    if (!sess.dead) setStatus(e.message, true);
  }
}

function sbOp(sess, fn) {
  const p = sess.chain.then(fn);
  sess.chain = p.catch(() => {});
  return p;
}
function sbWait(sb, action) {
  return new Promise((resolve, reject) => {
    const off = () => { sb.removeEventListener('updateend', ok); sb.removeEventListener('error', bad); };
    const ok = () => { off(); resolve(); };
    const bad = () => { off(); reject(new Error('Video buffer error')); };
    sb.addEventListener('updateend', ok); sb.addEventListener('error', bad);
    try { action(); } catch (e) { off(); reject(e); }
  });
}

function idxAt(t) {
  const segs = S.segs; let lo = 0, hi = segs.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (segs[m].start <= t) lo = m; else hi = m - 1; }
  return lo;
}
function windowFor(cur) { return [Math.max(0, cur - BEHIND), Math.min(S.segs.length - 1, cur + AHEAD)]; }

async function evict(sess, lo, hi) {
  for (const i of [...sess.have]) {
    if (i >= lo && i <= hi) continue;
    const s = sess.segs[i];
    try { await sbOp(sess, () => sbWait(sess.sb, () => sess.sb.remove(s.start, s.start + s.dur))); } catch {}
    sess.have.delete(i); sess.cells[i].classList.remove('on');
  }
}

async function appendSeg(sess, i, data) {
  try { await sbOp(sess, () => sbWait(sess.sb, () => sess.sb.appendBuffer(data))); }
  catch (e) {
    if (e.name !== 'QuotaExceededError') throw e;
    const [lo, hi] = windowFor(idxAt(video.currentTime));
    await evict(sess, Math.max(lo, i - 1), Math.min(hi, i + 1));   // tighten, then retry once
    await sbOp(sess, () => sbWait(sess.sb, () => sess.sb.appendBuffer(data)));
  }
}

async function pump() {
  const sess = S;
  if (!sess || !sess.sb) return;
  if (sess.pumping) { sess.again = true; return; }
  sess.pumping = true;
  try {
    do {
      sess.again = false;
      const cur = idxAt(video.currentTime), [lo, hi] = windowFor(cur);
      sess.cells.forEach((c, i) => c.classList.toggle('now', i === cur));
      await evict(sess, lo, hi);
      const order = [cur];
      for (let i = cur + 1; i <= hi; i++) order.push(i);
      for (let i = cur - 1; i >= lo; i--) order.push(i);
      for (const i of order) {
        if (sess.dead || sess.again) break;
        if (sess.have.has(i)) continue;
        const seg = sess.segs[i], ctrl = new AbortController();
        sess.inflight = { i, ctrl };
        let data;
        try {
          const raw = await fetchBuf(`${WORKER}/r/${relTag(sess.tag, seg.p || 0)}/${seg.name}`, ctrl.signal);
          data = await decryptChunk(sess.key, seg.name, raw);
        } catch (e) {
          if (e.name === 'AbortError') { sess.again = true; break; }
          throw e;
        } finally { sess.inflight = null; }
        if (sess.dead) return;
        const [nlo, nhi] = windowFor(idxAt(video.currentTime));
        if (i < nlo || i > nhi) { sess.again = true; break; }       // user moved on while downloading
        await appendSeg(sess, i, data);
        sess.have.add(i); sess.cells[i].classList.add('on');
        const n = sess.segs.length;
        setStatus(`Chunk ${cur + 1} of ${n}. Buffered ${sess.have.size} nearby.`);
        if (sess.have.has(n - 1) && sess.ms.readyState === 'open') {
          try { await sbOp(sess, () => { if (sess.ms.readyState === 'open') sess.ms.endOfStream(); }); } catch {}
        }
      }
    } while (sess.again && !sess.dead);
  } catch (e) {
    if (!sess.dead) setStatus(e.message || 'Playback error', true);
  } finally { sess.pumping = false; }
}

// Called whenever the playhead moves: abort downloads that are no longer near it.
function onMove() {
  if (!S || !S.sb) return;
  const [lo, hi] = windowFor(idxAt(video.currentTime));
  if (S.inflight && (S.inflight.i < lo || S.inflight.i > hi)) S.inflight.ctrl.abort();
  pump();
}
video.addEventListener('seeking', onMove);
video.addEventListener('timeupdate', onMove);
video.addEventListener('waiting', onMove);

/* ====== player controls ====== */
function seekTo(t) {
  if (!S || !S.man) return;
  video.currentTime = Math.min(Math.max(0, t), S.man.duration - 0.1);
}
document.querySelectorAll('[data-skip]').forEach((b) => b.onclick = () => { seekTo(video.currentTime + Number(b.dataset.skip)); b.blur(); });
function parseTime(s) {
  const p = s.trim().split(':').map(Number);
  if (!p.length || p.length > 3 || p.some((x) => !isFinite(x) || x < 0)) return null;
  return p.reduce((a, x) => a * 60 + x, 0);
}
function doJump() {
  const t = parseTime($('#jump').value);
  if (t === null) { setStatus('Enter a time like 1:23:45, 12:30 or 90.', true); return; }
  seekTo(t);
}
$('#jumpBtn').onclick = (e) => { doJump(); e.currentTarget.blur(); };
$('#jump').addEventListener('keydown', (e) => { if (e.key === 'Enter') doJump(); e.stopPropagation(); });
$('#speed').onchange = (e) => { video.playbackRate = parseFloat(e.target.value); e.target.blur(); };

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (!$('#playerOverlay').classList.contains('hidden')) closePlayer(); return; }
  const tag = document.activeElement.tagName;
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(tag)) return;
  if (!S || $('#playerOverlay').classList.contains('hidden')) return;
  const k = e.key.toLowerCase();
  if (tag === 'BUTTON' && (k === ' ' || k === 'enter')) return;
  if (k === ' ' || k === 'k') { e.preventDefault(); video.paused ? video.play().catch(() => {}) : video.pause(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); seekTo(video.currentTime - 5); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); seekTo(video.currentTime + 5); }
  else if (k === 'j') seekTo(video.currentTime - 30);
  else if (k === 'l') seekTo(video.currentTime + 30);
});

route();
</script>
</body>
</html>
