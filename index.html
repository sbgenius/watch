<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Video</title>
<style>
:root{color-scheme:dark;--font:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#f2f2f5;font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
video{position:fixed;inset:0;width:100%;height:100dvh;background:#000;object-fit:contain;outline:none}
.note{position:fixed;left:0;right:0;bottom:7rem;text-align:center;padding:0 1rem;font-size:.85rem;color:#a7a7b5;pointer-events:none;text-shadow:0 1px 6px #000}
.note.bad{color:#ff5c6c}
.gone{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;text-align:center;padding:1.5rem;background:#0a0a0d}
.gone svg{width:112px;height:auto;margin-bottom:.4rem;overflow:visible}
.gone .ghost{animation:float 3s ease-in-out infinite}
.gone h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.gone p{font-size:.95rem;color:#a7a7b5;max-width:28rem;line-height:1.5}
.load{position:fixed;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;pointer-events:none;z-index:4;opacity:0;transition:opacity .3s;animation:ld-spin .9s linear infinite}
.load.on{opacity:1}
@keyframes ld-spin{to{transform:rotate(360deg)}}
.wrap{position:fixed;inset:0;background:#000;user-select:none;-webkit-user-select:none}
.wrap.idle{cursor:none}
.ctl{position:fixed;left:0;right:0;bottom:0;padding:2.5rem 1rem .6rem;background:linear-gradient(transparent,rgba(0,0,0,.78));transition:opacity .25s;z-index:5}
.wrap.idle .ctl{opacity:0;pointer-events:none}
.bar{position:relative;height:16px;cursor:pointer;touch-action:none;display:flex;align-items:center}
.bar::before{content:"";position:absolute;left:0;right:0;height:4px;background:rgba(255,255,255,.25);border-radius:2px;transition:height .1s}
.bar i{position:absolute;left:0;height:4px;border-radius:2px;pointer-events:none;transition:height .1s}
.bar:hover::before,.bar:hover i,.bar.drag::before,.bar.drag i{height:6px}
#buf{background:rgba(255,255,255,.4)}#pl{background:#ff3d54}
.knob{position:absolute;width:13px;height:13px;border-radius:50%;background:#ff3d54;transform:translateX(-50%) scale(0);transition:transform .1s;pointer-events:none}
.bar:hover .knob,.bar.drag .knob{transform:translateX(-50%) scale(1)}
.tip{position:absolute;bottom:22px;transform:translateX(-50%);background:rgba(0,0,0,.85);padding:.2rem .5rem;border-radius:4px;font-size:.75rem;display:none;pointer-events:none}
.bar:hover .tip,.bar.drag .tip{display:block}
.row{display:flex;align-items:center;gap:.3rem;margin-top:.3rem}
.row button{background:none;border:0;color:#fff;min-width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.row button:hover{background:rgba(255,255,255,.15)}
.row svg{width:24px;height:24px;fill:currentColor}
#bSpeed{padding:0 .7rem;border-radius:4px;font-size:.85rem;font-weight:600}
#vol{width:70px;accent-color:#fff}
#time{font-size:.82rem;font-variant-numeric:tabular-nums;margin-left:.5rem}
.sp{flex:1}
@keyframes float{50%{transform:translateY(-9px)}}
@media (prefers-reduced-motion:reduce){*:not(.load){animation:none!important}.load{animation-duration:2.5s}}
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <video id="video" playsinline></video>
  <div class="note" id="note" role="status"></div>
  <div class="load" id="load" aria-hidden="true"></div>
  <div class="ctl" id="ctl">
    <div class="bar" id="bar"><i id="buf"></i><i id="pl"></i><div class="knob" id="knob"></div><div class="tip" id="tip"></div></div>
    <div class="row">
      <button id="bPlay" aria-label="Play or pause"></button>
      <button id="bMute" aria-label="Mute"></button>
      <input id="vol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
      <span id="time">0:00 / 0:00</span><span class="sp"></span>
      <button id="bSpeed" aria-label="Speed">1x</button>
      <button id="bFs" aria-label="Fullscreen"></button>
    </div>
  </div>
</div>

<div class="gone hidden" id="gone">
  <svg viewBox="0 0 120 134" aria-hidden="true">
    <ellipse cx="60" cy="126" rx="30" ry="5" fill="#fff" opacity=".08"/>
    <g class="ghost">
      <path d="M20 62C20 32 40 14 60 14s40 18 40 48v46l-12-10-14 12-14-12-14 12-14-12-12 10z" fill="#e4e0ff"/>
      <ellipse cx="46" cy="56" rx="6" ry="8" fill="#0a0a0d"/>
      <ellipse cx="74" cy="56" rx="6" ry="8" fill="#0a0a0d"/>
      <ellipse cx="60" cy="77" rx="5" ry="7" fill="#0a0a0d"/>
      <circle cx="34" cy="70" r="5" fill="#ff9fb2" opacity=".85"/>
      <circle cx="86" cy="70" r="5" fill="#ff9fb2" opacity=".85"/>
    </g>
  </svg>
  <h1>This video has vanished.</h1>
  <p>Either the link is wrong, or there never was a video here. Nothing to see, move along.</p>
</div>

<script>
'use strict';
/* ====== config (keep in sync with main.py / worker) ====== */
const WORKER = 'https://streamer.shreyasgokhale200.workers.dev';
const AHEAD = 6, BEHIND = 3;
const SECRET_RE = /^[A-Za-z0-9_-]{43}$/;

const $ = (s) => document.querySelector(s);
const enc = new TextEncoder(), dec = new TextDecoder();

/* ====== crypto ======
   tag = "v" + sha256("tag:" + secret)   -> public release tag (what the worker sees)
   key = sha256("key:" + secret)         -> AES-256-GCM key (never leaves the browser)
   The secret lives in the URL #fragment, which browsers never send to servers. */
const hex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
async function deriveFromSecret(secret) {
  const tag = 'v' + hex(await crypto.subtle.digest('SHA-256', enc.encode('tag:' + secret)));
  const raw = await crypto.subtle.digest('SHA-256', enc.encode('key:' + secret));
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  return { tag, key };
}
// iv(12) || ct || tag(16), AAD = asset name   (manifest.bin, init.bin, seg_*.bin)
function decryptChunk(key, name, buf) {
  const u = new Uint8Array(buf);
  return crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: u.slice(0, 12), additionalData: enc.encode(name) }, key, u.slice(12));
}

/* ====== ui helpers ====== */
const video = $('#video');
function setStatus(t, bad) {
  const n = $('#note');
  n.textContent = t || '';
  n.classList.toggle('bad', !!bad);
}
function showGone() {
  stopPlayback();
  setStatus('');
  $('#wrap').classList.add('hidden');
  $('#gone').classList.remove('hidden');
  document.title = 'Not found';
}
function showVideo() {
  $('#gone').classList.add('hidden');
  $('#wrap').classList.remove('hidden');
}
const notFound = (msg) => Object.assign(new Error(msg), { notFound: true });

/* ====== routing: location.hash IS the secret ====== */
const hashSecret = () => location.hash.replace(/^#\/?/, '');
function route() {
  const secret = hashSecret();
  hold = null;
  if (!SECRET_RE.test(secret)) { showGone(); return; }
  showVideo();
  openVideo(secret);
}
window.addEventListener('hashchange', route);

/* ====== player ====== */
let S = null;
let hold = null;   // {t, d, until}: position/duration shown while the player is being rebuilt

function stopPlayback() {
  if (!S) return;
  S.dead = true;
  clearInterval(S.saver);
  if (S.inflight) S.inflight.ctrl.abort();
  try { video.pause(); } catch {}
  video.removeAttribute('src'); video.load();
  if (S.url) URL.revokeObjectURL(S.url);
  S = null;
}

// part 0 keeps the plain tag; overflow parts are tag-1, tag-2, ...
const relTag = (tag, p) => (p ? `${tag}-${p}` : tag);

async function fetchBuf(url, signal) {
  const r = await fetch(url, { signal });
  if (r.status === 404) throw notFound('Video not found');
  if (!r.ok) throw new Error(`Download failed (${r.status})`);
  return r.arrayBuffer();
}

async function fetchRetry(url, signal, tries = 3) {
  for (let n = 1; ; n++) {
    try { return await fetchBuf(url, signal); }
    catch (e) {
      if (e.notFound || e.name === 'AbortError' || n >= tries) throw e;
      await new Promise((r) => setTimeout(r, 400 * n));
    }
  }
}

// Tear the player down and rebuild it at the same spot (used for decoder / MediaSource failures).
function recover(opts = {}) {
  if (!S || S.dead) return;
  if (S.retries >= 5) { hold = null; setStatus('Playback failed. Reload the page.', true); return; }
  const secret = S.secret, retries = S.retries + 1, rate = video.playbackRate;
  // resume where the viewer clicked if a seek was in flight, otherwise just before the current position
  const t = opts.t !== undefined ? opts.t : (pending !== null ? pending : Math.max(0, video.currentTime - 1));
  hold = { t, d: dur(), until: Date.now() + 20000 };   // keep the progress bar parked here during the rebuild
  pending = null;
  const play = opts.play !== undefined ? opts.play : !video.paused;
  console.warn('Recovering player', retries, 'at', t);
  setStatus(opts.quiet ? '' : `Reconnecting... (${retries}/5)`);
  stopPlayback();
  // give the browser a moment to fully detach the old MediaSource before building a new one
  setTimeout(() => { if (!S && hashSecret() === secret) openVideo(secret, t, retries, rate, play); }, 150 * retries);
}

async function openVideo(secret, resumeAt = null, retries = 0, rate = 1, play = true) {
  if (S && S.secret === secret) return;
  stopPlayback();
  document.title = 'Video';
  setStatus('Opening...');
  const sess = { secret, retries, startedAt: 0, dead: false, have: new Set(), inflight: null, pumping: false, again: false };
  S = sess;
  try {
    const { tag, key } = await deriveFromSecret(secret);
    sess.tag = tag; sess.key = key;
    const buf = await fetchRetry(`${WORKER}/r/${tag}/manifest.bin`);
    let man;
    try { man = JSON.parse(dec.decode(await decryptChunk(key, 'manifest.bin', buf))); }
    catch { throw notFound('Could not decrypt'); }
    if (sess.dead) return;
    document.title = man.title || 'Video';
    if (!window.MediaSource || !MediaSource.isTypeSupported(man.mime))
      throw new Error('This browser cannot play this video format.');
    Object.assign(sess, { man, segs: man.segments, ms: new MediaSource() });
    sess.url = URL.createObjectURL(sess.ms);
    video.src = sess.url;
    await new Promise((res) => sess.ms.addEventListener('sourceopen', res, { once: true }));
    if (sess.dead) return;
    sess.ms.duration = man.duration;
    sess.sb = sess.ms.addSourceBuffer(man.mime);
    sess.sb.mode = 'segments';
    sess.chain = Promise.resolve();

    const initBuf = await decryptChunk(key, man.init, await fetchRetry(`${WORKER}/r/${relTag(tag, man.init_part || 0)}/${man.init}`));
    if (sess.dead) return;
    await sbOp(sess, () => sbWait(sess.sb, () => sess.sb.appendBuffer(initBuf)));

    let start = resumeAt;                      // set when recovering from a playback error
    if (start === null) {
      start = 0; try { start = parseFloat(localStorage.getItem('pos:' + tag) || '0') || 0; } catch {}
      if (!(start > 5 && start < man.duration - 5)) start = 0;
    }
    if (start > 0) video.currentTime = start;
    sess.startedAt = start;
    video.playbackRate = rate;
    sess.saver = setInterval(() => {
      try { if (!video.paused) localStorage.setItem('pos:' + tag, String(video.currentTime)); } catch {}
      if (sess.retries && !video.paused && video.currentTime > sess.startedAt + 20) sess.retries = 0;   // stable again
    }, 5000);
    setStatus('');
    sess.ready = true;
    pump();
    if (resumeAt !== null && play) video.play().catch(() => {});
  } catch (e) {
    if (sess.dead) return;
    if (e.notFound) showGone();
    else if (e.name === 'InvalidStateError') recover({ t: resumeAt !== null ? resumeAt : 0, play });
    else setStatus(e.message, true);
  }
}

function sbOp(sess, fn) {
  const p = sess.chain.then(fn);
  sess.chain = p.catch(() => {});
  return p;
}
function sbWait(sb, action) {
  return new Promise((resolve, reject) => {
    const off = () => { sb.removeEventListener('updateend', ok); sb.removeEventListener('error', bad); };
    const ok = () => { off(); resolve(); };
    const bad = () => { off(); reject(new Error('Video buffer error')); };
    sb.addEventListener('updateend', ok); sb.addEventListener('error', bad);
    try { action(); } catch (e) { off(); reject(e); }
  });
}

function idxAt(t) {
  const segs = S.segs; let lo = 0, hi = segs.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (segs[m].start <= t) lo = m; else hi = m - 1; }
  return lo;
}
// Ask the browser what is really buffered (it may evict on its own), not our own bookkeeping.
function isBuf(sess, i) {
  const g = sess.segs[i], m = g.start + g.dur / 2, b = sess.sb.buffered;
  for (let k = 0; k < b.length; k++) if (b.start(k) <= m && b.end(k) >= m) return true;
  return false;
}
function windowFor(cur) { return [Math.max(0, cur - BEHIND), Math.min(S.segs.length - 1, cur + AHEAD)]; }

async function evict(sess, lo, hi) {
  for (const i of [...sess.have]) {
    if (i >= lo && i <= hi) continue;
    const s = sess.segs[i];
    try { await sbOp(sess, () => sbWait(sess.sb, () => sess.sb.remove(s.start, s.start + s.dur - 0.01))); } catch {}
    sess.have.delete(i);
  }
}

async function appendSeg(sess, i, data) {
  try { await sbOp(sess, () => sbWait(sess.sb, () => sess.sb.appendBuffer(data))); }
  catch (e) {
    if (e.name !== 'QuotaExceededError') throw e;
    const [lo, hi] = windowFor(idxAt(video.currentTime));
    await evict(sess, Math.max(lo, i - 1), Math.min(hi, i + 1));   // tighten, then retry once
    await sbOp(sess, () => sbWait(sess.sb, () => sess.sb.appendBuffer(data)));
  }
}

function allBufFrom(sess, from) {
  for (let i = from; i < sess.segs.length; i++) if (!isBuf(sess, i)) return false;
  return true;
}
// Only signal end-of-stream when everything from the playhead to the end is really buffered.
async function maybeEnd(sess) {
  if (sess.dead || sess.ms.readyState !== 'open') return;
  if (!allBufFrom(sess, idxAt(video.currentTime))) return;
  try { await sbOp(sess, () => { if (sess.ms.readyState === 'open') sess.ms.endOfStream(); }); } catch {}
}

async function pump() {
  const sess = S;
  if (!sess || !sess.sb) return;
  if (sess.ms.readyState === 'closed') { recover(); return; }   // browser detached our MediaSource
  if (sess.pumping) { sess.again = true; return; }
  sess.pumping = true;
  try {
    do {
      sess.again = false;
      const cur = idxAt(video.currentTime), [lo, hi] = windowFor(cur);
      let skipped = !isBuf(sess, cur);            // mid-seek: keep old data until the target is in
      if (!skipped && sess.have.size > 30) await evict(sess, lo, hi);   // remove rarely, in one batch
      const order = [cur];
      for (let i = cur + 1; i <= hi; i++) order.push(i);
      for (let i = cur - 1; i >= lo; i--) order.push(i);
      for (const i of order) {
        if (sess.dead || sess.again) break;
        if (isBuf(sess, i)) continue;
        const seg = sess.segs[i], ctrl = new AbortController();
        sess.inflight = { i, ctrl };
        let data;
        try {
          const raw = await fetchRetry(`${WORKER}/r/${relTag(sess.tag, seg.p || 0)}/${seg.name}`, ctrl.signal);
          data = await decryptChunk(sess.key, seg.name, raw);
        } catch (e) {
          if (e.name === 'AbortError') { sess.again = true; break; }
          throw e;
        } finally { sess.inflight = null; }
        if (sess.dead) return;
        const [nlo, nhi] = windowFor(idxAt(video.currentTime));
        if (i < nlo || i > nhi) { sess.again = true; break; }       // user moved on while downloading
        await appendSeg(sess, i, data);
        sess.have.add(i);
        if (skipped && i === cur) { skipped = false; if (sess.have.size > 30) await evict(sess, lo, hi); }
        if (sess.failed) { sess.failed = false; setStatus(''); }
      }
      if (!sess.dead && !sess.again) await maybeEnd(sess);
    } while (sess.again && !sess.dead);
  } catch (e) {
    if (!sess.dead) {
      if (e.name === 'InvalidStateError' || e.message === 'Video buffer error') recover();
      else { sess.failed = true; setStatus(e.message || 'Playback error', true); }
    }
  } finally { sess.pumping = false; }
}

// Called whenever the playhead moves: abort downloads that are no longer near it.
function onMove() {
  if (!S || !S.sb) return;
  const [lo, hi] = windowFor(idxAt(video.currentTime));
  if (S.inflight && (S.inflight.i < lo || S.inflight.i > hi)) S.inflight.ctrl.abort();
  pump();
}
video.addEventListener('seeking', onMove);
video.addEventListener('timeupdate', onMove);
video.addEventListener('waiting', onMove);

// Chrome sometimes drops the decoder mid-video ("file is corrupt") even though the data is fine.
// Rebuild the player at the same position instead of leaving the viewer stuck.
video.addEventListener('error', () => {
  if (!S || S.dead || !S.sb) return;
  if (S.url && video.currentSrc && video.currentSrc !== S.url) return;   // stale error from an old session
  const e = video.error;
  const detail = e ? `code ${e.code}${e.message ? ': ' + e.message : ''}` : 'unknown';
  console.error('Video error', detail, 'at', video.currentTime);
  const d = dur();
  if (d && video.currentTime >= d - 2) recover({ t: 0, play: false, quiet: true });   // failed while draining at the very end
  else recover();
});

/* ====== keyboard shortcuts ====== */
function seekTo(t) {
  if (!S || !S.man) return;
  t = Math.min(Math.max(0, t), S.man.duration - 0.1);
  pending = t; setTimeout(() => { if (pending === t) { pending = null; paint(); } }, 8000);
  video.currentTime = t;
  paint();
}
document.addEventListener('keydown', (e) => {
  if (!S || !S.man) return;
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'k') { e.preventDefault(); toggle(); }
  else if (k === 'm') video.muted = !video.muted;
  else if (e.key === 'ArrowLeft') { e.preventDefault(); seekTo(video.currentTime - 5); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); seekTo(video.currentTime + 5); }
  else if (k === 'j') seekTo(video.currentTime - 30);
  else if (k === 'l') seekTo(video.currentTime + 30);
  else if (k === 'f') { document.fullscreenElement ? document.exitFullscreen() : video.requestFullscreen?.(); }
});

/* ====== custom controls ====== */
const IC = {
  play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  vol: '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zM16 8a5 5 0 010 8z"/></svg>',
  mute: '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9z"/><path d="M15 9l6 6m0-6l-6 6" stroke="currentColor" stroke-width="2" fill="none"/></svg>',
  fs: '<svg viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5zM14 5h5v5h-2V7h-3zM5 14h2v3h3v2H5zM17 14h2v5h-5v-2h3z"/></svg>',
};
const wrap = $('#wrap'), bar = $('#bar'), tip = $('#tip'), SPEEDS = [0.75, 1, 1.25, 1.5, 2];
let pending = null, drag = false, idleT;
const dur = () => (S && S.man ? S.man.duration : hold ? hold.d : 0);
const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0'); return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`; };
const toggle = () => (video.paused ? video.play().catch(() => {}) : video.pause());
const goFs = () => (document.fullscreenElement ? document.exitFullscreen() : wrap.requestFullscreen?.());

const loader = $('#load');
function busy() {   // spinner while opening, seeking, or starved for data
  const opening = S && !S.ready && !$('#note').classList.contains('bad');
  const starved = S && S.ready && !video.ended && video.readyState < 3 && (!video.paused || video.seeking || pending !== null);
  loader.classList.toggle('on', !!(opening || starved));
}
function paint() {
  if (hold && (Date.now() > hold.until || (S && S.ready && video.readyState >= 2))) hold = null;
  const d = dur(), t = pending !== null ? pending : hold ? hold.t : video.currentTime;
  const pct = d ? Math.min(100, t / d * 100) : 0;
  $('#pl').style.width = pct + '%'; $('#knob').style.left = pct + '%';
  let be = 0; const b = video.buffered;
  for (let i = 0; i < b.length; i++) if (b.start(i) <= t + 0.5 && b.end(i) >= t) be = b.end(i);
  $('#buf').style.width = (d ? Math.min(100, be / d * 100) : 0) + '%';
  $('#time').textContent = fmt(t) + ' / ' + fmt(d);
  busy();
}
function icons() {
  $('#bPlay').innerHTML = video.paused ? IC.play : IC.pause;
  $('#bMute').innerHTML = video.muted || video.volume === 0 ? IC.mute : IC.vol;
  $('#bSpeed').textContent = video.playbackRate + 'x';
}
function poke() {
  wrap.classList.remove('idle'); clearTimeout(idleT);
  idleT = setTimeout(() => { if (!video.paused && !drag) wrap.classList.add('idle'); }, 2500);
}

const barT = (e) => { const r = bar.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * dur(); };
bar.addEventListener('pointerdown', (e) => { if (!dur()) return; drag = true; bar.classList.add('drag'); bar.setPointerCapture(e.pointerId); pending = barT(e); paint(); });
bar.addEventListener('pointermove', (e) => {
  if (!dur()) return;
  const t = barT(e), r = bar.getBoundingClientRect();
  tip.textContent = fmt(t); tip.style.left = (e.clientX - r.left) + 'px';
  if (drag) { pending = t; paint(); }
});
bar.addEventListener('pointerup', (e) => { if (!drag) return; drag = false; bar.classList.remove('drag'); seekTo(barT(e)); });
bar.addEventListener('pointercancel', () => { drag = false; pending = null; bar.classList.remove('drag'); });

$('#bPlay').onclick = toggle;
$('#bMute').onclick = () => { video.muted = !video.muted; };
$('#vol').oninput = (e) => { video.volume = +e.target.value; video.muted = false; };
$('#bSpeed').onclick = () => { video.playbackRate = SPEEDS[(SPEEDS.indexOf(video.playbackRate) + 1) % SPEEDS.length]; };
$('#bFs').innerHTML = IC.fs; $('#bFs').onclick = goFs;
video.addEventListener('click', toggle);
video.addEventListener('dblclick', () => { toggle(); goFs(); });

['play', 'pause', 'volumechange', 'ratechange'].forEach((ev) => video.addEventListener(ev, icons));
['timeupdate', 'progress', 'seeking', 'durationchange', 'loadedmetadata', 'waiting', 'playing', 'canplay', 'stalled'].forEach((ev) => video.addEventListener(ev, paint));
video.addEventListener('seeked', () => { pending = null; paint(); });
video.addEventListener('pause', poke);
['mousemove', 'pointerdown', 'touchstart'].forEach((ev) => wrap.addEventListener(ev, poke, { passive: true }));
document.addEventListener('keydown', poke);
setInterval(paint, 250);
icons(); paint(); poke();

route();
</script>
</body>
</html>
