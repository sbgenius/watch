<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Video</title>
<style>
:root{color-scheme:dark;--font:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#f2f2f5;font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
video{position:fixed;inset:0;width:100%;height:100dvh;background:#000;object-fit:contain;outline:none}
.note{position:fixed;left:0;right:0;bottom:4.5rem;text-align:center;padding:0 1rem;font-size:.85rem;color:#a7a7b5;pointer-events:none;text-shadow:0 1px 6px #000}
.note.bad{color:#ff5c6c}
.gone{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;text-align:center;padding:1.5rem;background:#0a0a0d}
.gone svg{width:112px;height:auto;margin-bottom:.4rem;overflow:visible}
.gone .ghost{animation:float 3s ease-in-out infinite}
.gone h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.gone p{font-size:.95rem;color:#a7a7b5;max-width:28rem;line-height:1.5}
@keyframes float{50%{transform:translateY(-9px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<video id="video" controls playsinline></video>
<div class="note" id="note" role="status"></div>

<div class="gone hidden" id="gone">
  <svg viewBox="0 0 120 134" aria-hidden="true">
    <ellipse cx="60" cy="126" rx="30" ry="5" fill="#fff" opacity=".08"/>
    <g class="ghost">
      <path d="M20 62C20 32 40 14 60 14s40 18 40 48v46l-12-10-14 12-14-12-14 12-14-12-12 10z" fill="#e4e0ff"/>
      <ellipse cx="46" cy="56" rx="6" ry="8" fill="#0a0a0d"/>
      <ellipse cx="74" cy="56" rx="6" ry="8" fill="#0a0a0d"/>
      <ellipse cx="60" cy="77" rx="5" ry="7" fill="#0a0a0d"/>
      <circle cx="34" cy="70" r="5" fill="#ff9fb2" opacity=".85"/>
      <circle cx="86" cy="70" r="5" fill="#ff9fb2" opacity=".85"/>
    </g>
  </svg>
  <h1>This video has vanished.</h1>
  <p>Either the link is wrong, or there never was a video here. Nothing to see, move along.</p>
</div>

<script>
'use strict';
/* ====== config (keep in sync with main.py / worker) ====== */
const WORKER = 'https://streamer.shreyasgokhale200.workers.dev';
const AHEAD = 4, BEHIND = 2;
const SECRET_RE = /^[A-Za-z0-9_-]{43}$/;

const $ = (s) => document.querySelector(s);
const enc = new TextEncoder(), dec = new TextDecoder();

/* ====== crypto ======
   tag = "v" + sha256("tag:" + secret)   -> public release tag (what the worker sees)
   key = sha256("key:" + secret)         -> AES-256-GCM key (never leaves the browser)
   The secret lives in the URL #fragment, which browsers never send to servers. */
const hex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
async function deriveFromSecret(secret) {
  const tag = 'v' + hex(await crypto.subtle.digest('SHA-256', enc.encode('tag:' + secret)));
  const raw = await crypto.subtle.digest('SHA-256', enc.encode('key:' + secret));
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  return { tag, key };
}
// iv(12) || ct || tag(16), AAD = asset name   (manifest.bin, init.bin, seg_*.bin)
function decryptChunk(key, name, buf) {
  const u = new Uint8Array(buf);
  return crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: u.slice(0, 12), additionalData: enc.encode(name) }, key, u.slice(12));
}

/* ====== ui helpers ====== */
const video = $('#video');
function setStatus(t, bad) {
  const n = $('#note');
  n.textContent = t || '';
  n.classList.toggle('bad', !!bad);
}
function showGone() {
  stopPlayback();
  setStatus('');
  video.classList.add('hidden');
  $('#gone').classList.remove('hidden');
  document.title = 'Not found';
}
function showVideo() {
  $('#gone').classList.add('hidden');
  video.classList.remove('hidden');
}
const notFound = (msg) => Object.assign(new Error(msg), { notFound: true });

/* ====== routing: location.hash IS the secret ====== */
const hashSecret = () => location.hash.replace(/^#\/?/, '');
function route() {
  const secret = hashSecret();
  if (!SECRET_RE.test(secret)) { showGone(); return; }
  showVideo();
  openVideo(secret);
}
window.addEventListener('hashchange', route);

/* ====== player ====== */
let S = null;

function stopPlayback() {
  if (!S) return;
  S.dead = true;
  clearInterval(S.saver);
  if (S.inflight) S.inflight.ctrl.abort();
  try { video.pause(); } catch {}
  video.removeAttribute('src'); video.load();
  if (S.url) URL.revokeObjectURL(S.url);
  S = null;
}

// part 0 keeps the plain tag; overflow parts are tag-1, tag-2, ...
const relTag = (tag, p) => (p ? `${tag}-${p}` : tag);

async function fetchBuf(url, signal) {
  const r = await fetch(url, { signal });
  if (r.status === 404) throw notFound('Video not found');
  if (!r.ok) throw new Error(`Download failed (${r.status})`);
  return r.arrayBuffer();
}

async function openVideo(secret, resumeAt = null, retries = 0, rate = 1) {
  if (S && S.secret === secret) return;
  stopPlayback();
  document.title = 'Video';
  setStatus('Opening...');
  const sess = { secret, retries, startedAt: 0, dead: false, have: new Set(), inflight: null, pumping: false, again: false };
  S = sess;
  try {
    const { tag, key } = await deriveFromSecret(secret);
    sess.tag = tag; sess.key = key;
    const buf = await fetchBuf(`${WORKER}/r/${tag}/manifest.bin`);
    let man;
    try { man = JSON.parse(dec.decode(await decryptChunk(key, 'manifest.bin', buf))); }
    catch { throw notFound('Could not decrypt'); }
    if (sess.dead) return;
    document.title = man.title || 'Video';
    if (!window.MediaSource || !MediaSource.isTypeSupported(man.mime))
      throw new Error('This browser cannot play this video format.');
    Object.assign(sess, { man, segs: man.segments, ms: new MediaSource() });
    sess.url = URL.createObjectURL(sess.ms);
    video.src = sess.url;
    await new Promise((res) => sess.ms.addEventListener('sourceopen', res, { once: true }));
    if (sess.dead) return;
    sess.ms.duration = man.duration;
    sess.sb = sess.ms.addSourceBuffer(man.mime);
    sess.sb.mode = 'segments';
    sess.chain = Promise.resolve();

    const initBuf = await decryptChunk(key, man.init, await fetchBuf(`${WORKER}/r/${relTag(tag, man.init_part || 0)}/${man.init}`));
    if (sess.dead) return;
    await sbOp(sess, () => sbWait(sess.sb, () => sess.sb.appendBuffer(initBuf)));

    let start = resumeAt;                      // set when recovering from a playback error
    if (start === null) {
      start = 0; try { start = parseFloat(localStorage.getItem('pos:' + tag) || '0') || 0; } catch {}
      if (!(start > 5 && start < man.duration - 5)) start = 0;
    }
    if (start > 0) video.currentTime = start;
    sess.startedAt = start;
    video.playbackRate = rate;
    sess.saver = setInterval(() => {
      try { if (!video.paused) localStorage.setItem('pos:' + tag, String(video.currentTime)); } catch {}
      if (sess.retries && !video.paused && video.currentTime > sess.startedAt + 20) sess.retries = 0;   // stable again
    }, 5000);
    setStatus('');
    pump();
    if (resumeAt !== null) video.play().catch(() => {});
  } catch (e) {
    if (sess.dead) return;
    if (e.notFound) showGone();
    else setStatus(e.message, true);
  }
}

function sbOp(sess, fn) {
  const p = sess.chain.then(fn);
  sess.chain = p.catch(() => {});
  return p;
}
function sbWait(sb, action) {
  return new Promise((resolve, reject) => {
    const off = () => { sb.removeEventListener('updateend', ok); sb.removeEventListener('error', bad); };
    const ok = () => { off(); resolve(); };
    const bad = () => { off(); reject(new Error('Video buffer error')); };
    sb.addEventListener('updateend', ok); sb.addEventListener('error', bad);
    try { action(); } catch (e) { off(); reject(e); }
  });
}

function idxAt(t) {
  const segs = S.segs; let lo = 0, hi = segs.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (segs[m].start <= t) lo = m; else hi = m - 1; }
  return lo;
}
function windowFor(cur) { return [Math.max(0, cur - BEHIND), Math.min(S.segs.length - 1, cur + AHEAD)]; }

async function evict(sess, lo, hi) {
  for (const i of [...sess.have]) {
    if (i >= lo && i <= hi) continue;
    const s = sess.segs[i];
    try { await sbOp(sess, () => sbWait(sess.sb, () => sess.sb.remove(s.start, s.start + s.dur))); } catch {}
    sess.have.delete(i);
  }
}

async function appendSeg(sess, i, data) {
  try { await sbOp(sess, () => sbWait(sess.sb, () => sess.sb.appendBuffer(data))); }
  catch (e) {
    if (e.name !== 'QuotaExceededError') throw e;
    const [lo, hi] = windowFor(idxAt(video.currentTime));
    await evict(sess, Math.max(lo, i - 1), Math.min(hi, i + 1));   // tighten, then retry once
    await sbOp(sess, () => sbWait(sess.sb, () => sess.sb.appendBuffer(data)));
  }
}

async function pump() {
  const sess = S;
  if (!sess || !sess.sb) return;
  if (sess.pumping) { sess.again = true; return; }
  sess.pumping = true;
  try {
    do {
      sess.again = false;
      const cur = idxAt(video.currentTime), [lo, hi] = windowFor(cur);
      await evict(sess, lo, hi);
      const order = [cur];
      for (let i = cur + 1; i <= hi; i++) order.push(i);
      for (let i = cur - 1; i >= lo; i--) order.push(i);
      for (const i of order) {
        if (sess.dead || sess.again) break;
        if (sess.have.has(i)) continue;
        const seg = sess.segs[i], ctrl = new AbortController();
        sess.inflight = { i, ctrl };
        let data;
        try {
          const raw = await fetchBuf(`${WORKER}/r/${relTag(sess.tag, seg.p || 0)}/${seg.name}`, ctrl.signal);
          data = await decryptChunk(sess.key, seg.name, raw);
        } catch (e) {
          if (e.name === 'AbortError') { sess.again = true; break; }
          throw e;
        } finally { sess.inflight = null; }
        if (sess.dead) return;
        const [nlo, nhi] = windowFor(idxAt(video.currentTime));
        if (i < nlo || i > nhi) { sess.again = true; break; }       // user moved on while downloading
        await appendSeg(sess, i, data);
        sess.have.add(i);
        const n = sess.segs.length;
        if (sess.have.has(n - 1) && sess.ms.readyState === 'open') {
          try { await sbOp(sess, () => { if (sess.ms.readyState === 'open') sess.ms.endOfStream(); }); } catch {}
        }
      }
    } while (sess.again && !sess.dead);
  } catch (e) {
    if (!sess.dead) setStatus(e.message || 'Playback error', true);
  } finally { sess.pumping = false; }
}

// Called whenever the playhead moves: abort downloads that are no longer near it.
function onMove() {
  if (!S || !S.sb) return;
  const [lo, hi] = windowFor(idxAt(video.currentTime));
  if (S.inflight && (S.inflight.i < lo || S.inflight.i > hi)) S.inflight.ctrl.abort();
  pump();
}
video.addEventListener('seeking', onMove);
video.addEventListener('timeupdate', onMove);
video.addEventListener('waiting', onMove);

// Chrome sometimes drops the decoder mid-video ("file is corrupt") even though the data is fine.
// Rebuild the player at the same position instead of leaving the viewer stuck.
video.addEventListener('error', () => {
  if (!S || S.dead || !S.sb) return;
  const e = video.error;
  const detail = e ? `code ${e.code}${e.message ? ': ' + e.message : ''}` : 'unknown';
  console.error('Video error', detail, 'at', video.currentTime);
  if (S.retries >= 3) { setStatus(`Playback failed (${detail}). Reload the page.`, true); return; }
  const secret = S.secret, retries = S.retries + 1, t = Math.max(0, video.currentTime - 1), rate = video.playbackRate;
  setStatus(`Playback hiccup. Recovering ${retries}/3...`, true);
  stopPlayback();
  openVideo(secret, t, retries, rate);
});

/* ====== keyboard shortcuts ====== */
function seekTo(t) {
  if (!S || !S.man) return;
  video.currentTime = Math.min(Math.max(0, t), S.man.duration - 0.1);
}
document.addEventListener('keydown', (e) => {
  if (!S || !S.man) return;
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'k') { e.preventDefault(); video.paused ? video.play().catch(() => {}) : video.pause(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); seekTo(video.currentTime - 5); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); seekTo(video.currentTime + 5); }
  else if (k === 'j') seekTo(video.currentTime - 30);
  else if (k === 'l') seekTo(video.currentTime + 30);
  else if (k === 'f') { document.fullscreenElement ? document.exitFullscreen() : video.requestFullscreen?.(); }
});

route();
</script>
</body>
</html>
